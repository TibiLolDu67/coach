<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coach</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0B0D0F"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Coach">
<style>
/* ===== Tokens : thème sombre (identité principale) ===== */
:root{--bg:#0B0D0F;--pan:#14171A;--soft:#1D2126;--ln:#2B3036;--ln2:#3A4047;--tx:#F5F6F7;--mu:#A6ADB5;--acc:#FF7A2F;--acc2:#FF914D;--accs:rgba(255,122,47,.14);--on:#0B0D0F;--in:#101316;
--grn:#3FB37F;--red:#F0564A;--amb:#F2B33D;--grnt:#5FD39C;--redt:#FF8A80;--ambt:#F6C35B;--lamp:#23282E;--gt:#06140D;
--hero:linear-gradient(160deg,#1F2328 0%,#14171A 70%);--ring:#FF7A2F;--navbg:#14171A;--navln:#2B3036;--sh:0 14px 34px -22px rgba(0,0,0,.9);
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--rc:24px;--rk:14px;--ease:cubic-bezier(.2,.7,.2,1);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
/* ===== Tokens : thème clair (mêmes formes, accent orange) ===== */
[data-theme=light]{--bg:#F3F4F6;--pan:#FFFFFF;--soft:#EEF0F3;--ln:#E1E4E8;--ln2:#C9CED4;--tx:#111316;--mu:#5C636B;--acc:#F06A1E;--acc2:#FF7A2F;--accs:rgba(240,106,30,.12);--on:#0B0D0F;--in:#F7F8FA;
--grn:#23955F;--red:#D4433A;--amb:#D9971A;--grnt:#1B7A4D;--redt:#B9342C;--ambt:#8A5E00;--lamp:#E9EBEE;--gt:#FFFFFF;
--hero:linear-gradient(160deg,#1F2328 0%,#111316 75%);--ring:#FF7A2F;--navbg:#111316;--navln:#111316;--sh:0 1px 2px rgba(16,24,40,.05),0 10px 26px -18px rgba(16,24,40,.25);
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;color-scheme:light}

/* ===== Base ===== */
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding:16px 16px 180px}
h1{font:800 28px/1.1 system-ui,-apple-system,sans-serif;letter-spacing:-.02em;color:var(--tx);margin:6px 0 16px}
small{color:var(--mu);font-size:13px;line-height:1.45}
b{font-weight:700}
hr{border:0;border-top:1px solid var(--ln);margin:14px 0}
.sec{font-weight:700;font-size:15px;letter-spacing:-.01em;color:var(--tx);margin:22px 2px 10px}
.row{display:flex;gap:8px;align-items:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.grid input{padding:8px 4px;text-align:center}
.g3{display:grid;grid-template-columns:1fr 1.2fr 1.2fr;gap:6px;margin:8px 0}.g3 input,.g3 select{padding:8px 4px;font-size:14px}
.full{width:100%}

/* ===== Surfaces ===== */
.card{background:var(--pan);border:1px solid var(--ln);border-radius:var(--rc);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.card>b:first-child{font-size:17px;letter-spacing:-.01em}
.ico{width:44px;height:44px;border-radius:14px;background:var(--accs);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
.hero{position:relative;overflow:hidden;background:var(--hero);color:#fff;border:1px solid var(--navln);border-radius:28px;padding:20px;display:flex;align-items:center;gap:16px;margin-bottom:12px;box-shadow:var(--sh)}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,122,47,.22),transparent 70%);pointer-events:none}
.hero>*{position:relative;z-index:1}.hero small{display:block;color:rgba(255,255,255,.72)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.tiles>*{min-width:0}
.tile{box-sizing:border-box;background:var(--pan);color:var(--tx);border:1px solid var(--ln);border-radius:20px;padding:14px 16px;text-align:left;min-height:0;display:block;width:100%;box-shadow:var(--sh)}
.tile small{display:block}.tile .n{font:800 30px/1.15 system-ui,-apple-system,sans-serif;letter-spacing:-.02em;margin:4px 0 2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* ===== Boutons ===== */
button{background:var(--acc);color:var(--on);border:1px solid transparent;border-radius:var(--rk);padding:10px 16px;font-family:inherit;font-weight:650;font-size:15px;line-height:1.2;min-height:44px;cursor:pointer;
 transition:background-color .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease),transform .15s var(--ease)}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.soft{background:var(--soft);color:var(--tx);border-color:var(--ln)}
.danger{background:rgba(240,86,74,.12);color:var(--redt);border-color:rgba(240,86,74,.4)}
.play{width:52px;height:52px;padding:0;border:0;border-radius:50%;font-size:17px;flex:none}
.sg{display:block;width:100%;text-align:left;border-radius:var(--rk);margin-top:6px;font-weight:550}
.seg{display:flex;gap:4px;background:var(--in);border:1px solid var(--ln);border-radius:16px;padding:4px}
.seg button{flex:1;background:transparent;color:var(--mu);border:0;border-radius:12px}.seg button.on{background:var(--acc);color:var(--on)}
.feel{gap:6px}.feel button{flex:1;padding:6px;background:var(--soft);color:var(--tx);border-color:var(--ln)}.feel button.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
@media (hover:hover){
 button:hover{background:var(--acc2)}
 .soft:hover,.feel button:not(.on):hover,.set button:hover{background:var(--soft);border-color:var(--ln2)}
 .danger:hover{background:rgba(240,86,74,.2)}
 .tile:hover{background:var(--pan);border-color:var(--ln2)}
 .seg button:not(.on):hover,nav.sub button:not(.on):hover{background:var(--soft);color:var(--tx)}
 nav.tabbar button:not(.on):hover{background:rgba(255,255,255,.06);color:#fff}
 .toast button:hover{background:rgba(255,255,255,.18)}}

/* ===== Navigation ===== */
nav{display:flex;gap:6px;margin-bottom:16px}
nav button{flex:1;padding:6px 2px;font-size:14px;background:var(--pan);color:var(--mu);border:1px solid var(--ln)}
nav button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
nav.sub{margin-top:-6px;overflow-x:auto;gap:4px;background:var(--pan);border:1px solid var(--ln);border-radius:16px;padding:4px;scrollbar-width:none}
nav.sub::-webkit-scrollbar{display:none}
nav.sub button{flex:1 0 auto;padding:6px 12px;font-size:14px;font-weight:600;min-height:44px;background:transparent;color:var(--mu);border:0;border-radius:12px}
nav.sub button.on{background:var(--accs);color:var(--acc)}
nav.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 28px));margin:0;background:var(--navbg);border:1px solid var(--navln);border-radius:24px;padding:6px;gap:4px;box-shadow:0 18px 40px -14px rgba(0,0,0,.7);z-index:5;box-sizing:border-box}
nav.tabbar button{flex:1;background:transparent;border:0;color:#8B929A;min-height:52px;padding:4px 2px;border-radius:18px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav.tabbar button.on{background:var(--accs);color:var(--acc)}

/* ===== Formulaires ===== */
input,textarea,select{font:600 16px/1.3 system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;border:1px solid var(--ln);border-radius:12px;padding:10px 12px;background:var(--in);color:var(--tx);width:100%;box-sizing:border-box;transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
textarea{font-weight:500}
input:not([type=checkbox]),select{min-height:44px}
input::placeholder,textarea::placeholder{color:var(--mu);opacity:.85;font-weight:500}
input:focus,textarea:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accs);outline:none}
input[type=checkbox]{width:26px;height:26px;accent-color:var(--acc);flex:none;padding:0;box-shadow:none}
label.chk{display:flex;gap:10px;align-items:center;font-weight:600;margin:12px 0}
details{margin:10px 0}summary{font-weight:600;cursor:pointer}summary::marker{color:var(--acc)}
.set{display:flex;gap:8px;align-items:center;margin:10px 0}.set b{min-width:22px;color:var(--mu);font-size:14px}
.set input{flex:1;min-width:0;text-align:center;font-size:22px;font-weight:700;padding:8px 4px}
.set button{flex:none;width:46px;font-size:22px;padding:0;background:var(--soft);color:var(--tx);border-color:var(--ln)}
.set input.kg{flex:none;width:68px;font-size:16px;padding:8px 2px}.set input[type=checkbox]{flex:none;width:32px;height:32px}
.set.ok b{color:var(--grn)}.set.ok input[type=number]{border-color:var(--grn)}

/* ===== Voyants, barres, graphiques ===== */
.lamp{display:inline-flex;align-items:center;gap:6px;vertical-align:1px;padding:2px 10px;border-radius:999px;font:700 11.5px/1.5 system-ui,-apple-system,sans-serif;letter-spacing:.05em;background:var(--lamp);color:var(--mu)}
.lamp::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.g{background:var(--grn);color:var(--gt)}.y{background:var(--amb);color:#14171c}.r{background:var(--red);color:#fff}
.lamp.g{background:rgba(63,179,127,.15);color:var(--grnt)}.lamp.y{background:rgba(242,179,61,.16);color:var(--ambt)}.lamp.r{background:rgba(240,86,74,.15);color:var(--redt)}
.rec,.lamp.rec{background:var(--acc);color:var(--on)}
.bl{display:flex;gap:10px;align-items:flex-start;margin-top:10px}.bl .lamp{flex:none;min-width:84px;justify-content:center;margin-top:2px}
.bar{height:8px;border:0;border-radius:99px;background:var(--soft);overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;border-radius:99px}
small:has(+.bar){display:block;margin-top:10px}
.ct{font:600 10px system-ui,sans-serif;fill:var(--tx)}.cl{font:9px system-ui,sans-serif;fill:var(--mu)}.cg{stroke:var(--ln);stroke-width:1}#nhs{display:block;touch-action:pan-y}
.lg{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 4px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}

/* ===== Bandeaux flottants (Annuler, minuteur de repos) ===== */
#float{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 28px));z-index:6;pointer-events:none}
.toast{pointer-events:auto;margin-top:8px;box-sizing:border-box;background:#1D2126;color:#F5F6F7;border:1px solid #2B3036;border-radius:20px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 18px 40px -14px rgba(0,0,0,.7);z-index:6}
.toast span{flex:1}.toast small{color:#A6ADB5}
.toast button{background:rgba(255,255,255,.1);color:#fff;border:0}
.toast .bar{margin:6px 0 0;background:rgba(255,255,255,.12)}.toast .bar i{background:var(--ring)}
.toast.done{background:var(--grn);border-color:transparent;color:#06140D}.toast.done button{background:rgba(0,0,0,.16);color:#06140D}

/* ===== Composition des écrans ===== */
.ph{margin:8px 2px 18px}.ph h1{font-size:32px;margin:0}.ph .eye{display:block;color:var(--acc);font-weight:700;font-size:13px;letter-spacing:.02em;margin-bottom:2px}
.ph.home .eye{color:var(--mu);font-weight:600}.ph.home .eye::first-letter{text-transform:uppercase}
h2.sec{font-size:18px;margin:26px 2px 12px}
.split>div>:first-child{margin-top:0}
.qa{margin:12px 0 0}.qa button{min-height:52px;font-size:16px}
button.big{min-height:56px;font-size:16px;font-weight:700;border-radius:18px;margin:0 0 12px}
.ghost{background:transparent;color:var(--mu);border-color:var(--ln);margin-top:4px}
.sm{min-height:44px;padding:8px 14px;font-size:14px}
.ico-b{width:44px;padding:0;flex:none}
.sessl{display:grid;gap:10px;margin-bottom:12px}
.sess{display:flex;align-items:center;gap:14px;background:var(--pan);border:1px solid var(--ln);border-radius:22px;padding:14px 14px 14px 18px;box-shadow:var(--sh)}
.sess b{display:block;font-size:18px;letter-spacing:-.01em;overflow-wrap:anywhere}.sess small{display:block}
.coach .ico{margin-top:2px}
.sess-h{display:block}.sess-h .bar{background:rgba(255,255,255,.14);margin:12px 0 6px}.sess-h small:has(+.bar){margin-top:2px}
.ex .exh{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}.ex .exh b{font-size:19px;letter-spacing:-.01em}.ex .exv{margin:8px 0 6px}
.opts{display:flex;flex-wrap:wrap;column-gap:20px}.opts label.chk{margin:8px 0}
.blk{background:var(--soft);border:1px solid var(--ln);border-radius:18px;padding:12px;margin-top:12px}.blk input,.blk textarea{background:var(--in)}
.tin{font-size:18px;font-weight:700}.tin2{font-size:17px;font-weight:700}
.hh{margin-bottom:4px}
.list{padding-top:6px;padding-bottom:6px}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--ln)}
.hh+.li,.mh+.li,.list>.li:first-child{border-top:0}
.li .lv{margin-top:2px}.li .lt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.kc{white-space:nowrap}
.grip{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin:-6px 2px -6px -10px;border-radius:12px;color:var(--mu);cursor:grab;flex:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.grip:active{cursor:grabbing;color:var(--acc)}.grip:focus-visible{outline:2px solid var(--acc2);outline-offset:0}
.ex .exh{align-items:center}.dragmode{user-select:none;-webkit-user-select:none}
.dragging{position:relative;z-index:20;border-color:var(--acc)!important;box-shadow:0 22px 44px -12px rgba(0,0,0,.85)!important;transition:none!important}
.dropb{box-shadow:0 -3px 0 0 var(--acc)!important}.dropa{box-shadow:0 3px 0 0 var(--acc)!important}
.tipx p{margin:8px 0 0;color:var(--mu);font-size:14px;line-height:1.55}details.li{margin:0}details.li summary{font-weight:650}
.vrow{display:grid;grid-template-columns:92px 1fr 28px 34px;gap:10px;align-items:center;margin:10px 0}.vrow .bar{margin:0}.vrow span{font-size:14px;font-weight:600}.vd{text-align:right}
.li.fe{display:block}.li.fe .row button{min-height:44px}
.cq{margin:8px 0}.cq input{width:96px;flex:none}
.mh{margin-bottom:2px}
.sum .big{white-space:nowrap;font:800 44px/1 system-ui,-apple-system,sans-serif;letter-spacing:-.03em;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.sum .big small{font-size:15px;font-weight:600;letter-spacing:0;margin-left:4px}
.dsel{width:160px}.dsel input{padding:8px 10px;font-size:14px}
/* Ordinateur : navigation en rail à gauche, deux colonnes pour Accueil, Nutrition et Corps */
@media (min-width:960px){
 #app{max-width:none;margin:0;padding:36px 40px 120px 148px}
 main{max-width:680px;margin:0 auto}main.w{max-width:1100px}
 .split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
 .split>div>h2.sec:first-child{margin-top:0}
 nav.tabbar{left:28px;top:50%;bottom:auto;transform:translateY(-50%);width:92px;flex-direction:column;padding:8px;border-radius:28px}
 nav.tabbar button{min-height:76px;font-size:12px}
 #float{left:calc(50% + 54px);bottom:24px}
 .ph h1{font-size:38px}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}button:active{transform:none}}
</style></head><body><div id="app"></div><div id="float"><div id="undo" aria-live="polite"></div><div id="rest"></div></div>
<script>
const K='pcm1',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,8);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=t=>new Date(t).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const V={up:['AUGMENTER','g'],keep:['MAINTENIR','y'],down:['RÉGRESSER','r']};
const ex=(n,s,a,b,c,p)=>({id:uid(),name:n,sets:s,min:a,max:b,charge:c,step:p,rest:90,tip:'',verdict:'',why:''});
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!Array.isArray(S.program))S={program:[
 {id:uid(),name:'Séance A',exos:[ex('Développé couché',3,8,12,40,2.5),ex('Rowing barre',3,8,12,40,2.5)]},
 {id:uid(),name:'Séance B',exos:[ex('Squat',3,6,10,60,2.5),ex('Soulevé de terre roumain',3,8,12,60,2.5)]}],history:[],tab:'seance',draft:null};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}syncSoon()};
const norm=s=>String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
function libAdd(x,a){a=a||S.lib;const n=String(x.n||'').trim(),nn=norm(n);if(!n||n=='Repas')return;const e=a.find(y=>norm(y.n)==nn);if(e){e.k=+x.k||0;e.p=+x.p||0;e.g=+x.g||0;e.l=+x.l||0;e.u++}else a.push({n,k:+x.k||0,p:+x.p||0,g:+x.g||0,l:+x.l||0,u:1})}
function migrate(){
 if(!Array.isArray(S.history))S.history=[];
 S.profile=S.profile||{sex:'m',age:'',h:'',act:1.2,ses:3,neck:'',waist:'',hip:'',goal:'cut',rate:0.3};S.weights=S.weights||[];S.food=S.food||{};S.favs=S.favs||[];S.tpl=S.tpl||[];S.cycle=S.cycle||{start:'',weeks:8,rest:7};S.sheets=S.sheets||[];S.cost=S.cost||{lines:[{id:uid(),n:'Abonnement salle',cat:'Salle',amt:35,per:'mois'}],trip:0,dur:0,oth:0,weeks:48};
 S.program.forEach(d=>{d.id=d.id||uid();d.exos=d.exos||[];d.exos.forEach(e=>{e.id=e.id||uid();if(e.rest==null)e.rest=90})});
 const all=S.program.flatMap(d=>d.exos);
 S.history.forEach(h=>h.exos.forEach(o=>{if(!o.id){const d=S.program.find(x=>x.name===h.day),e=(d&&d.exos.find(x=>x.name===o.n))||all.find(x=>x.name===o.n);if(e)o.id=e.id}}));
 if(!Array.isArray(S.lib)){S.lib=[];Object.keys(S.food).sort().forEach(d=>S.food[d].forEach(x=>libAdd(x)))}
 document.documentElement.dataset.theme=S.theme||'light'}
migrate();S.tab='home';save();
const lamp=e=>e.verdict?`<span class="lamp ${V[e.verdict][1]}">${V[e.verdict][0]}</span> <small>${esc(e.why)}</small>`:'<span class="lamp">NOUVEAU</span>';
const prev=e=>{for(let i=S.history.length-1;i>=0;i--){const x=S.history[i].exos.find(o=>o.id?o.id===e.id:o.n===e.name);if(x)return x}return null};
let U=null;
function undoable(msg,fn,ms){if(U)clearTimeout(U.t);U={fn,t:setTimeout(()=>{U=null;$('#undo').innerHTML=''},ms||6000)};$('#undo').innerHTML=`<div class="toast"><span>${esc(msg)}</span><button data-a="undo">Annuler</button></div>`}
let AC=null,RT=null;
const audio=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}};
function signal(){
 try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
 if(S.sound===false||!AC)return;
 try{[0,.25,.5].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+d;o.frequency.value=880;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.start(t);o.stop(t+.2)})}catch(e){}}
function restStart(sec){S.rest={end:Date.now()+sec*1000,tot:sec};restTick()}
function restTick(){
 const el=$('#rest'),r=S.rest;
 if(!r){el.innerHTML='';el.dataset.st='';clearInterval(RT);RT=null;return}
 if(!RT)RT=setInterval(restTick,250);
