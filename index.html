<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coach</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#111114"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Coach">
<style>
:root{--bg:#0b0b0f;--pan:#17171d;--ln:#2a2a33;--tx:#f2f2f5;--mu:#8e8e9c;--acc:#8b5cf6;--grn:#34b27b;--red:#e5534b;--in:#101015;--on:#fff;--soft:#23232c;--lamp:#33333d;--gt:#06140d;--amb:#f5a524;--hero:linear-gradient(120deg,#6d28d9,#a855f7);--ring:#fbbf24;--navbg:#1c1c24;--s1:#3987e5;--s2:#d95926;--s3:#199e70;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
[data-theme=light]{--bg:#f3f3f5;--pan:#fff;--ln:#e8e8ec;--tx:#111114;--mu:#767683;--acc:#111114;--grn:#2f9e6e;--red:#d1453b;--in:#f3f3f5;--on:#fff;--soft:#efeff2;--lamp:#e3e3e8;--gt:#fff;--amb:#e0a030;--hero:#111114;--ring:#fff;--navbg:#111114;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px 14px 180px}
h1{font:700 22px system-ui,-apple-system,sans-serif;color:var(--tx);margin:4px 0 14px}.ico{width:44px;height:44px;border-radius:10px;background:var(--acc);color:var(--on);display:flex;align-items:center;justify-content:center;flex:none}.sec{font-weight:600;color:var(--mu);margin:18px 0 8px}.soft.play{width:44px;padding:0;background:var(--pan);border:1px solid var(--ln);color:var(--acc);font-size:16px}
nav{display:flex;gap:6px;margin-bottom:14px}
.card{background:var(--pan);border:1px solid var(--ln);border-radius:20px;padding:14px;margin-bottom:12px}
button{background:var(--acc);color:var(--on);border:0;border-radius:999px;padding:8px 14px;font:600 15px system-ui,sans-serif;min-height:44px;cursor:pointer}
button:active{opacity:.7}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
nav button{flex:1;padding:6px 2px;font-size:14px;background:var(--pan);color:var(--mu);border:1px solid var(--ln)}
nav button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
nav.sub{margin-top:-4px;overflow-x:auto}nav.sub button{flex:1 0 auto;padding:4px 10px;font-size:13px;min-height:36px;background:transparent;border:0;border-bottom:2px solid var(--ln);border-radius:0}
nav.sub button.on{background:transparent;color:var(--acc);border-bottom-color:var(--acc)}
.full{width:100%}.danger{background:var(--red);color:#fff}.soft{background:var(--soft);color:var(--tx)}
.feel button{flex:1;padding:6px;background:var(--soft);color:var(--tx)}.feel button.on{background:var(--acc);color:var(--on)}
input,textarea,select{font:600 16px ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--ln);border-radius:12px;padding:8px;background:var(--in);color:var(--tx);width:100%;box-sizing:border-box}
input[type=checkbox]{width:26px;height:26px;accent-color:var(--acc);flex:none}
.set{display:flex;gap:8px;align-items:center;margin:8px 0}.set input{text-align:center;font-size:22px}.set button{width:52px;font-size:22px;padding:0;background:var(--soft);color:var(--tx)}
.row{display:flex;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.grid input{padding:6px;text-align:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lamp{display:inline-block;padding:1px 9px;border-radius:99px;font:600 11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;background:var(--lamp);color:var(--tx)}
.ct{font:600 10px system-ui,sans-serif;fill:var(--tx)}.cl{font:9px system-ui,sans-serif;fill:var(--mu)}.cg{stroke:var(--ln);stroke-width:1}#nhs{display:block;touch-action:pan-y}
.lg{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 4px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.sg{display:block;width:100%;text-align:left;border-radius:12px;margin-top:6px;font-weight:500}
.rec{background:var(--acc);color:var(--on)}.bl{display:flex;gap:10px;align-items:flex-start;margin-top:10px}.bl .lamp{flex:none;min-width:74px;text-align:center;margin-top:2px}
.g{background:var(--grn);color:var(--gt)}.y{background:var(--amb);color:#14171c}.r{background:var(--red);color:#fff}
label.chk{display:flex;gap:10px;align-items:center;font-weight:600;margin:10px 0}
.bar{height:10px;border:1px solid var(--ln);border-radius:6px;background:var(--in);overflow:hidden;margin-bottom:8px}.bar i{display:block;height:100%}
details{margin:8px 0}summary{font-weight:600;cursor:pointer}
nav.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 28px));margin:0;background:var(--navbg);border-radius:999px;padding:6px;gap:4px;box-shadow:0 10px 28px rgba(0,0,0,.3);z-index:5;box-sizing:border-box}
nav.tabbar button{flex:1;background:transparent;border:0;color:#9b9ba6;min-height:48px;padding:4px 2px;border-radius:999px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabbar button.on{background:rgba(255,255,255,.16);color:#fff}
.hero{background:var(--hero);color:#fff;border-radius:22px;padding:18px;display:flex;align-items:center;gap:14px;margin-bottom:12px}.hero small{display:block;color:rgba(255,255,255,.8)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--pan);color:var(--tx);border:1px solid var(--ln);border-radius:18px;padding:14px;text-align:left;min-height:0;display:block;width:100%}.tile small{display:block}.tile .n{font:700 26px ui-monospace,Menlo,Consolas,monospace}
.seg{display:flex;gap:8px}.seg button{flex:1;background:var(--soft);color:var(--tx)}.seg button.on{background:var(--acc);color:var(--on)}
.g3{display:grid;grid-template-columns:1fr 1.2fr 1.2fr;gap:6px;margin:8px 0}.g3 input,.g3 select{padding:8px 4px;font-size:14px}
hr{border:0;border-top:1px solid var(--ln);margin:12px 0}
small{color:var(--mu)}
#fl{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 28px));z-index:6;pointer-events:none}
.set input{flex:1;min-width:0}.set button{flex:none;width:46px}.set input.kg{flex:none;width:68px;font-size:16px;padding:8px 2px}.set input[type=checkbox]{flex:none;width:32px;height:32px}.set.ok b{color:var(--grn)}.set.ok input[type=number]{border-color:var(--grn)}
.toast.done{background:var(--grn)}.toast .bar{margin:4px 0 0;border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.12)}.toast .bar i{background:var(--ring)}.toast small{color:rgba(255,255,255,.7)}
.toast{pointer-events:auto;margin-top:8px;box-sizing:border-box;background:var(--navbg);color:#fff;border:1px solid var(--ln);border-radius:18px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 28px rgba(0,0,0,.3);z-index:6}.toast span{flex:1}.toast button{background:rgba(255,255,255,.16);color:#fff}
</style></head><body><div id="app"></div><div id="fl"><div id="undo" aria-live="polite"></div><div id="rest"></div></div>
<script>
const K='pcm1',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,8);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=t=>new Date(t).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const V={up:['AUGMENTER','g'],keep:['MAINTENIR','y'],down:['RÉGRESSER','r']};
const ex=(n,s,a,b,c,p)=>({id:uid(),name:n,sets:s,min:a,max:b,charge:c,step:p,rest:90,tip:'',verdict:'',why:''});
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!Array.isArray(S.program))S={program:[
 {id:uid(),name:'Séance A',exos:[ex('Développé couché',3,8,12,40,2.5),ex('Rowing barre',3,8,12,40,2.5)]},
 {id:uid(),name:'Séance B',exos:[ex('Squat',3,6,10,60,2.5),ex('Soulevé de terre roumain',3,8,12,60,2.5)]}],history:[],tab:'seance',draft:null};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const norm=s=>String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
function libAdd(x,a){a=a||S.lib;const n=String(x.n||'').trim(),nn=norm(n);if(!n||n=='Repas')return;const e=a.find(y=>norm(y.n)==nn);if(e){e.k=+x.k||0;e.p=+x.p||0;e.g=+x.g||0;e.l=+x.l||0;e.u++}else a.push({n,k:+x.k||0,p:+x.p||0,g:+x.g||0,l:+x.l||0,u:1})}
function migrate(){
 if(!Array.isArray(S.history))S.history=[];
 S.profile=S.profile||{sex:'m',age:'',h:'',act:1.2,ses:3,neck:'',waist:'',hip:'',goal:'cut',rate:0.3};S.weights=S.weights||[];S.food=S.food||{};S.favs=S.favs||[];S.cost=S.cost||{lines:[{id:uid(),n:'Abonnement salle',cat:'Salle',amt:35,per:'mois'}],trip:0,dur:0,oth:0,weeks:48};
 S.program.forEach(d=>{d.id=d.id||uid();d.exos=d.exos||[];d.exos.forEach(e=>{e.id=e.id||uid();if(e.rest==null)e.rest=90})});
 const all=S.program.flatMap(d=>d.exos);
 S.history.forEach(h=>h.exos.forEach(o=>{if(!o.id){const d=S.program.find(x=>x.name===h.day),e=(d&&d.exos.find(x=>x.name===o.n))||all.find(x=>x.name===o.n);if(e)o.id=e.id}}));
 if(!Array.isArray(S.lib)){S.lib=[];Object.keys(S.food).sort().forEach(d=>S.food[d].forEach(x=>libAdd(x)))}
 document.documentElement.dataset.theme=S.theme||'light'}
migrate();S.tab='home';save();
const lamp=e=>e.verdict?`<span class="lamp ${V[e.verdict][1]}">${V[e.verdict][0]}</span> <small>${esc(e.why)}</small>`:'<span class="lamp">NOUVEAU</span>';
const prev=e=>{for(let i=S.history.length-1;i>=0;i--){const x=S.history[i].exos.find(o=>o.id?o.id===e.id:o.n===e.name);if(x)return x}return null};
let U=null;
function undoable(msg,fn,ms){if(U)clearTimeout(U.t);U={fn,t:setTimeout(()=>{U=null;$('#undo').innerHTML=''},ms||6000)};$('#undo').innerHTML=`<div class="toast"><span>${esc(msg)}</span><button data-a="undo">Annuler</button></div>`}
let AC=null,RT=null;
const audio=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}};
function signal(){
 try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
 if(S.sound===false||!AC)return;
 try{[0,.25,.5].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+d;o.frequency.value=880;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.start(t);o.stop(t+.2)})}catch(e){}}
function restStart(sec){S.rest={end:Date.now()+sec*1000,tot:sec};restTick()}
function restTick(){
 const el=$('#rest'),r=S.rest;
 if(!r){el.innerHTML='';el.dataset.st='';clearInterval(RT);RT=null;return}
 if(!RT)RT=setInterval(restTick,250);
 const ms=r.end-Date.now(),left=Math.max(0,Math.ceil(ms/1000)),st=ms<=0?'done':'run';
 if(ms<=0&&!r.done){r.done=1;save();if(ms>-3000)signal()}
 if(ms<-10000){S.rest=null;save();return restTick()}
 if(el.dataset.st!=st){el.dataset.st=st;el.innerHTML=st=='run'?'<div class="toast"><div style="flex:1"><small>Repos</small> <b id="rt" style="font:700 22px ui-monospace,Menlo,Consolas,monospace"></b><div class="bar"><i id="rb"></i></div></div><button data-a="restadd">+30 s</button><button data-a="restskip">Passer</button></div>':'<div class="toast done"><span><b>Repos terminé.</b> Série suivante !</span><button data-a="restskip">OK</button></div>'}
 if(st=='run'){$('#rt').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');$('#rb').style.width=Math.max(0,Math.min(100,ms/r.tot/10))+'%'}}

function vSeance(){
 if(!S.draft){
  if(!S.program.length)return '<div class="card">Aucune séance. Crée-en une dans Programme.</div>';
  const xs=S.program.flatMap(d=>d.exos),up=xs.filter(e=>e.verdict=='up').length,dn=xs.filter(e=>e.verdict=='down').length,l=S.history[S.history.length-1],c=coach(),pz=n=>n>1?'s':'';
  const msg=up?`${up} exercice${pz(up)} en hausse ! Production en progression, on charge.`:dn?`${dn} exercice${pz(dn)} à alléger. On réduit la cadence avant de repartir.`:l?'Cadence stable. On maintient la production.':'Ligne à l\'arrêt. Lance ta première séance.';
  return `<div class="card row" style="align-items:flex-start;gap:14px"><div class="ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></div><div><small><b>Coach</b></small><div>${msg}</div><small>${esc(c.m)}</small></div></div><p class="sec">Démarrer une séance</p><div class="g2">`+
   S.program.map((d,i)=>`<div class="card row" style="margin:0"><div style="flex:1"><b>${esc(d.name)}</b><br><small>${d.exos.length} exercice${pz(d.exos.length)}</small></div><button class="soft play" data-a="start" data-d="${i}" aria-label="Démarrer ${esc(d.name)}">▶</button></div>`).join('')+'</div>';
 }
 const d=S.program.find(x=>x.id==S.draft.day);if(!d){S.draft=null;return vSeance()}
 let h=`<div class="card"><b>${esc(d.name)}</b> <small>en cours. Coche chaque série faite pour lancer le repos.</small></div>`,todo=0;
 d.exos.forEach(e=>{
  let D=S.draft.x[e.id];
  if(!D){const p=prev(e);D=S.draft.x[e.id]={c:e.charge,cs:e.cs?e.cs.slice():null,r:(e.verdict=='keep'&&p)?p.r.slice():[],ok:[],pain:false,feel:0}}
  D.ok=D.ok||[];while(D.r.length<e.sets)D.r.push(e.min);D.r.length=e.sets;D.ok.length=e.sets;
  if(D.cs){while(D.cs.length<e.sets)D.cs.push(D.cs.length?D.cs[D.cs.length-1]:D.c);D.cs.length=e.sets}
  for(let i=0;i<e.sets;i++)if(!D.ok[i])todo++;
  h+=`<div class="card"><b>${esc(e.name)}</b> <small>${e.sets}×${e.min}-${e.max}${e.rest>0?', repos '+e.rest+' s':''}</small><div>${lamp(e)}</div>`+
  (e.tip?`<details><summary>Comment faire</summary>${esc(e.tip)}</details>`:'')+
  (D.cs?'<small>Charge (kg) puis répétitions, série par série</small>':`<label><small>Charge (kg)</small><input type="number" step="any" inputmode="decimal" data-k="c" data-x="${e.id}" value="${D.c}"></label>`)+
  D.r.map((v,i)=>`<div class="set${D.ok[i]?' ok':''}"><b>S${i+1}</b>${D.cs?`<input class="kg" type="number" step="any" inputmode="decimal" aria-label="Charge de la série ${i+1} en kg" data-k="cs" data-x="${e.id}" data-i="${i}" value="${D.cs[i]}">`:''}<button data-a="dec" data-x="${e.id}" data-i="${i}">−</button><input type="number" inputmode="numeric" data-k="r" data-x="${e.id}" data-i="${i}" value="${v}"><button data-a="inc" data-x="${e.id}" data-i="${i}">+</button><input type="checkbox" aria-label="Série ${i+1} faite" data-k="ok" data-x="${e.id}" data-i="${i}" ${D.ok[i]?'checked':''}></div>`).join('')+
  `<label class="chk"><input type="checkbox" data-k="multi" data-x="${e.id}" ${D.cs?'checked':''}>Charge différente par série</label>`+
  `<label class="chk"><input type="checkbox" data-k="pain" data-x="${e.id}" ${D.pain?'checked':''}>Douleur articulaire</label>`+
  `<small>Sensation : 1 dur, 5 top</small><div class="row feel">${[1,2,3,4,5].map(n=>`<button data-a="feel" data-x="${e.id}" data-i="${n}" class="${D.feel==n?'on':''}">${n}</button>`).join('')}</div></div>`;
 });
 return h+`<div class="card"><textarea rows="2" data-k="note" placeholder="Notes de séance">${esc(S.draft.note||'')}</textarea></div>${todo?`<p><small>${todo>1?todo+' séries non cochées : elles seront enregistrées telles quelles':'1 série non cochée : elle sera enregistrée telle quelle'}.</small></p>`:''}<button class="full" data-a="finish">✔ Terminer la séance</button><p><button class="soft" data-a="cancel">Annuler la séance</button></p>`;
}
function vProg(){
 const F=[['sets','Séries'],['min','Rép min'],['max','Rép max'],['charge','Charge'],['step','Palier'],['rest','Repos (s)']];
 return S.program.map((d,i)=>`<div class="card"><small>Nom de la séance</small><div class="row" style="margin-top:4px"><input data-k="dn" placeholder="Ex. Haut du corps" data-d="${i}" value="${esc(d.name)}"><button class="danger" data-a="delday" data-d="${i}" aria-label="Supprimer la séance">✕</button></div>`+
  d.exos.map((e,j)=>`<hr><input data-k="ef" data-f="name" data-d="${i}" data-e="${j}" value="${esc(e.name)}"><div class="grid">${F.map(f=>`<label><small>${f[1]}</small><input type="number" step="any" inputmode="decimal" data-k="ef" data-f="${f[0]}" data-d="${i}" data-e="${j}" value="${e[f[0]]}"></label>`).join('')}</div><textarea rows="2" data-k="ef" data-f="tip" data-d="${i}" data-e="${j}" placeholder="Consignes d'exécution">${esc(e.tip)}</textarea><p><button class="soft" data-a="delexo" data-d="${i}" data-e="${j}">Supprimer l'exercice</button></p>`).join('')+
  `<p><button data-a="addexo" data-d="${i}">+ Exercice</button></p></div>`).join('')+'<button class="full" data-a="addday">+ Nouvelle séance</button>';
}
function vHist(){
 if(!S.history.length)return '<div class="card">Aucune séance pour l\'instant. Termine ta première séance pour la retrouver ici.</div>';
 const M=marks();
 return S.history.map((h,i)=>({h,i})).reverse().map(({h,i})=>`<div class="card"><b>${esc(h.day)}</b> <small>${fd(h.t)}</small>`+
  h.exos.map((e,j)=>`<div>${esc(e.n)} :${e.cs?`<b>${e.cs.map((c,i)=>c+'×'+e.r[i]).join(' / ')}</b> <small>kg×rép.</small>`:`<b>${e.c} kg</b> × ${e.r.join('/')}`} <span class="lamp ${V[e.v][1]}">${V[e.v][0]}</span>${M.has(i+':'+j)?' <span class="lamp rec">RECORD</span>':''}${e.pain?' ⚠':''}</div>`).join('')+
  (h.note?`<div><small>${esc(h.note)}</small></div>`:'')+`<p><button class="soft" data-a="delh" data-i="${i}">Supprimer</button></p></div>`).join('');
}
const orm=o=>o.cs?Math.max(...o.cs.map((c,i)=>o.r[i]>0?c*(1+o.r[i]/30):0)):Math.max(...o.r)>0?o.c*(1+Math.max(...o.r)/30):0,n1=x=>(Math.round(x*10)/10).toString().replace('.',',');
function marks(){const best={},m=new Set();S.history.forEach((h,i)=>h.exos.forEach((o,j)=>{const k=o.id||o.n,v=orm(o);if(best[k]!=null&&v>best[k]+1e-9)m.add(i+':'+j);best[k]=Math.max(best[k]||0,v)}));return m}
function spark(p){
 if(p.length<2)return '<small>La courbe apparaît dès 2 séances.</small>';
 p=p.slice(-30);const t0=p[0].t,sp=(p[p.length-1].t-t0)||1,vs=p.map(x=>x.v),pad=(Math.max(...vs)-Math.min(...vs))*.15||1,lo=Math.min(...vs)-pad,hi=Math.max(...vs)+pad,X=t=>10+300*(t-t0)/sp,Y=v=>80-70*(v-lo)/(hi-lo);
 return `<svg viewBox="0 0 320 90" width="100%" role="img" aria-label="Évolution du 1RM estimé"><polyline fill="none" style="stroke:var(--acc)" stroke-width="3" stroke-linejoin="round" points="${p.map(x=>X(x.t)+','+Y(x.v)).join(' ')}"/>`+p.map(x=>`<circle cx="${X(x.t)}" cy="${Y(x.v)}" r="3" style="fill:var(--acc)"/>`).join('')+'</svg>'}
function vStats(){
 const xs=S.program.flatMap(d=>d.exos).map(e=>({e,pts:S.history.map(h=>{const o=h.exos.find(o=>o.id?o.id===e.id:o.n===e.name);return o?{t:h.t,v:orm(o),o}:null}).filter(p=>p&&p.v>0)})).filter(x=>x.pts.length);

 else if(a=='restskip'){S.rest=null;save();restTick();return}
 else if(a=='restadd'){if(S.rest){S.rest.end+=30000;S.rest.tot+=30;save();restTick()}return}
 else if(a=='sound')S.sound=b.dataset.v=='1';

 else if(a=='tab')S.tab=b.dataset.t;

 else if(a=='inc')D.r[i]++;

 else if(a=='delday'){const o=S.program[d],dr=S.draft&&S.draft.day==o.id?S.draft:null;if(dr)S.draft=null;S.program.splice(d,1);undoable('Séance « '+o.name+' » supprimée',()=>{S.program.splice(d,0,o);if(dr&&!S.draft)S.draft=dr})}
 else if(a=='addexo')S.program[d].exos.push(ex('Nouvel exercice',3,8,12,20,2.5));
 else if(a=='delexo'){const xs=S.program[d].exos,o=xs[j];xs.splice(j,1);undoable('Exercice « '+o.name+' » supprimé',()=>xs.splice(j,0,o))}
 else if(a=='delh'){const o=S.history[i];S.history.splice(i,1);undoable('Séance du '+fd(o.t)+' supprimée de l\'historique',()=>S.history.splice(i,0,o))}
 else if(a=='adj'){if(Date.now()-(S.adjT||0)>=14*864e5){S.adj=(S.adj||0)+(+b.dataset.v);S.adjT=Date.now()}}
 else if(a=='addw'){const v=parseFloat($('#wi').value);if(v>0){const ds=$('#wd').value||dk(),t=new Date(ds+'T08:00').getTime();S.weights=S.weights.filter(q=>new Date(q.t).toLocaleDateString('sv')!=ds);S.weights.push({t,w:v});S.weights.sort((a,b)=>a.t-b.t)}}
 else if(a=='addf'){const g=id=>parseFloat($('#'+id).value)||0,nm=$('#fn').value.trim();if(!nm&&!g('fk')&&!g('fp')&&!g('fg')&&!g('fl'))AM='Indique au moins un nom ou des valeurs avant d\'ajouter.';else{const x={m:$('#fm').value,n:nm||'Repas',k:g('fk'),p:g('fp'),g:g('fg'),l:g('fl'),q:g('fq')||1};S.food[ND]=(S.food[ND]||[]).concat(x);libAdd(x)}}
 else if(a=='favadd')S.food[ND]=(S.food[ND]||[]).concat(Object.assign({},S.favs[i],{m:$('#fm').value,q:parseFloat($('#fq').value)||1}));
 else if(a=='delf')S.food[ND].splice(i,1);
 else if(a=='copy1'){const x=(S.food[b.dataset.dt]||[])[i];if(x&&b.dataset.dt!=ND){S.food[ND]=(S.food[ND]||[]).concat(Object.assign({},x));NM='Copié : '+x.n+'.'}else NM='Choisis un autre jour.'}
 else if(a=='dupf')S.food[ND].splice(i+1,0,Object.assign({},S.food[ND][i]));
 else if(a=='copy'){const sd=CD||prevDay(ND),src=(S.food[sd]||[]).filter(x=>CM=='all'||(x.m||'Autre')==CM);if(sd==ND)NM='Choisis un autre jour.';else if(src.length){S.food[ND]=(S.food[ND]||[]).concat(src.map(x=>Object.assign({},x)));NM='Copié : '+src.length+' entrée'+(src.length>1?'s':'')+'.'}else NM='Rien à copier à cette date.'}
 else if(a=='starf'){const x=S.food[ND][i];if(!S.favs.some(q=>q.n==x.n))S.favs.push(Object.assign({},x,{q:1}))}
 else if(a=='delfav')S.favs.splice(i,1);
 else if(a=='addcl')S.cost.lines.push({id:uid(),n:'Nouvelle dépense',cat:'Autre',amt:0,per:'mois'});
 else if(a=='delcl'){const o=S.cost.lines[i];S.cost.lines.splice(i,1);undoable('Dépense « '+o.n+' » supprimée',()=>S.cost.lines.splice(i,0,o))}
 else if(a=='theme'){S.theme=b.dataset.v;document.documentElement.dataset.theme=S.theme}
 else if(a=='opend'){ND=b.dataset.dt;S.tab='nutri'}
 save();render();

 const t=ev.target,k=t.dataset.k;if(!k)return;
 if(k=='imf'){const f=t.files[0];if(f){const r=new FileReader();r.onload=()=>{DM=importData(r.result)||'Fichier invalide : choisis une sauvegarde ou un fichier d\'ajout pour Coach.';save();render()};r.readAsText(f)}return}
 const D=S.draft&&S.draft.x[t.dataset.x],n=parseFloat(t.value)||0;

 else if(k=='cs')D.cs[+t.dataset.i]=n;
 else if(k=='multi'){if(t.checked)D.cs=D.r.map(()=>D.c);else{D.c=Math.max(...D.cs);D.cs=null}save();render();return}
 else if(k=='ok'){D.ok[+t.dataset.i]=t.checked;audio();
  if(t.checked){const d=S.program.find(x=>x.id==S.draft.day),e=d.exos.find(x=>x.id==t.dataset.x),all=d.exos.every(x=>{const q=S.draft.x[x.id];return q&&q.ok&&q.ok.filter(Boolean).length>=x.sets});if(all||!(e.rest>0))S.rest=null;else restStart(e.rest)}
  save();render();return}
 else if(k=='pain')D.pain=t.checked;else if(k=='note')S.draft.note=t.value;
 else if(k=='dn'){const v=t.value.trim()||'Séance';t.value=v;S.program[+t.dataset.d].name=v}
 else if(k=='ec'){const e=S.food[ND][+t.dataset.i];e.q=parseFloat(t.value)||1;save();render();return}
 else if(k=='fm'){FM=t.value;return}
 else if(k=='cd'){CD=t.value;NM='';render();return}
 else if(k=='cm'){CM=t.value;NM='';render();return}
 else if(k=='nd'){ND=t.value||dk();CD='';NM='';render();return}
 else if(k=='cf'){const f=t.dataset.f,v=parseFloat(t.value)||0;if(f=='ses')S.profile.ses=v;else S.cost[f]=v;save();$('#cstat').innerHTML=costStats();return}
 else if(k=='cl'){const l=S.cost.lines[+t.dataset.i],f=t.dataset.f;l[f]=f=='amt'?(parseFloat(t.value)||0):t.value;save();$('#cstat').innerHTML=costStats();return}
 else if(k=='pf'){S.profile[t.dataset.f]=(t.tagName=='SELECT'&&t.dataset.f=='act')?parseFloat(t.value):t.value;save();$('#plan').innerHTML=planHtml();return}
 else if(k=='ef'){const e=S.program[+t.dataset.d].exos[+t.dataset.e],f=t.dataset.f;if(f=='charge'&&e.cs)e.cs=e.cs.map(c=>Math.max(0,c+n-e.charge));e[f]=(f=='name'||f=='tip')?t.value:n}
 save();
